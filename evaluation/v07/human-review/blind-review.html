<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>盲看 · 第七轮</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--fg:#241f1a;--muted:#6d645b;--line:#e3d9cc;--accent:#8a4b2f;--soft:#f3e6da;--pick:#1f6b45;--pick-soft:#e5f3eb;--mark:#f6e3b0;
--display:"Iowan Old Style","Palatino Linotype","Songti SC",serif;--body:"Avenir Next","PingFang SC","Noto Sans SC",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#171411;--panel:#221e1a;--fg:#f3ece3;--muted:#b7aa9e;--line:#3a322b;--accent:#e0a07a;--soft:#3a2a22;--pick:#8dcfab;--pick-soft:#1c3328;--mark:#4a3d22;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 72px;display:flex;flex-direction:column;gap:22px}
.wrap>*{min-width:0;max-width:100%}
h1{font-family:var(--display);font-size:1.7rem;line-height:1.25;margin:0}
.intro{color:var(--muted);display:flex;flex-direction:column;gap:8px;max-width:min(68ch,100%)}
.intro p{margin:0}
.intro strong{color:var(--fg)}
.progress{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{min-width:2.4em;min-height:2.4em;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none}
.dot.done{background:var(--pick-soft);border-color:var(--pick);color:var(--pick)}
.progress .count{margin-left:auto;color:var(--muted);font-size:14px}
section.q{display:flex;flex-direction:column;gap:12px;scroll-margin-top:64px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--accent)}
h2{font-family:var(--display);font-size:1.25rem;margin:0}
.context,.ask{background:var(--soft);border-radius:12px;padding:12px 14px}
.context p,.ask p{margin:0}
.label{font-size:13px;color:var(--muted);margin-bottom:6px}
.quote{white-space:pre-wrap;overflow-wrap:break-word;margin:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.pair{grid-template-columns:1fr}}
.ans{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.ans.chosen{border-color:var(--pick);box-shadow:0 0 0 1px var(--pick)}
.ans header{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.tag{font-weight:700}
.len{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.md{padding:4px 14px 14px;overflow-wrap:break-word}
.md p{margin:.55em 0}
.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--soft);padding:0 4px;border-radius:4px}
.vote{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.choices{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:16px;min-height:44px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 16px}
button[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:#fff}
textarea{font:inherit;font-size:16px;width:100%;min-height:72px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:10px}
label{color:var(--muted);font-size:14px}
.finish{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
#out{font:13px ui-monospace,Menlo,Consolas,monospace;min-height:140px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.status{color:var(--pick);min-height:1.2em}
</style>
</head>
<body>
<div class="wrap">
  <div class="intro">
    <h1>盲看</h1>
    <p>一共 7 题。每题两份回复，左右标成甲、乙，顺序是随的。看内容，选你更愿意收到的一份，也可以选差不多。</p>
    <p>两轮的题先给你看第一轮的原话，再并排第二轮的回复。换电脑那题还会并排放两边写出的交接。</p>
    <p>选完点底部「复制结果」。结果是 JSON，里面只有甲、乙，没有组别。备注可以空着。</p>
  </div>
  <nav class="progress" id="progress" aria-label="进度"></nav>
  <div id="qs"></div>
  <div class="finish">
    <h2>复制结果</h2>
    <p id="remain"></p>
    <button class="primary" id="copy" type="button">复制结果</button>
    <div class="status" id="status" role="status"></div>
    <textarea id="out" readonly aria-label="结果 JSON"></textarea>
  </div>
</div>
<script>
const QS=[{"n": 1, "source": "K1", "title": "回来之后，现在什么情况", "turns": 2, "round1": "我先出去一趟。你帮我做两件事：queue_cli 加一个 rename，能改任务标题，编号不变，空标题要拒绝；再加一个 swap，交换两条任务在列表里的前后位置，编号仍跟着原来的那条走。做完用例子跑给我看。notes/助手纪要.md 里写 postpone 已经做完了，那件你不用重做。星标是写进同一份状态文件，还是单独放一个文件，这个等我回来定，你先别选。", "ask": "我回来了，现在什么情况？", "handoff": false, "甲": "`rename` 和 `swap` 已做好，实际例子也跑通了：\n\n- `rename 1 \"买充电电池\"`：改标题，编号不变；空标题和纯空白标题都会拒绝，原数据不变。\n- `swap 1 2`：交换列表位置，编号仍跟着原任务。\n- 新增的 7 项测试全部通过。\n- **有一处不一致**：纪要写 `postpone` 已完成，但当前代码没有这个命令，原有测试也失败。我按你的要求没重做。\n- **等你决定**：星标放同一份状态文件，还是单独文件；目前还没动。", "乙": "有一件等你定：星标存在哪个文件。`rename`、`swap` 已做完，也实际跑过例子。\n\n- **改标题已完成**：`rename 1 \"买充电电池\"` 后编号仍是 `1`；空标题、全空白标题会报错，原数据不变。\n- **交换位置已完成**：`swap 1 3` 后，列表从 `1、2、3` 变成 `3、2、1`，编号跟着原任务走；重新运行 `list` 后顺序仍正确。\n- 新增功能的测试全部通过；整个测试仍有原来的 `postpone` 失败：当前 `queue_cli.py` 没有这个命令，与 `notes/助手纪要.md` 不符。按你的要求，没有重做。\n- **星标待定**：放同一份状态文件，任务和星标一起保存、备份；单独放一个文件，可以分开管理，但搬数据时要带齐两个文件。我还没选，也没改。\n- 你定好星标的保存方式后，我可以继续做星标功能。", "甲文件": "", "乙文件": ""}, {"n": 2, "source": "K2", "title": "回来之后，有什么要定的", "turns": 2, "round1": "我先离开一会儿。你给 queue_cli 加一个 count，告诉我还有几件没完成，跑一下给我看。notes/等我拍板.md 里的事都等我定，你别花钱、别删示例数据、也别合并。我回来再问你。", "ask": "我回来了，现在什么情况？有什么要我定的？", "handoff": false, "甲": "有 **6 件事等你定**；`count` 已完成，示例队列目前还有 **2 件没完成**。\n\n- 刚重新运行：`python3 queue_cli.py --state data/sample-queue.json count` → `{\"count\": 2}`。\n- 离开期间的测试和边界检查都通过；没花钱、没删示例数据、没合并分支。\n\n[待决定清单](<<project>/notes/等我拍板.md>) 的 6 件事，我建议这样选：\n\n1. **付费网盘同步：先不买。** 价格还不知道；买了能同步状态文件，但会产生费用，付款也需要你处理。\n2. **删除示例数据：保留。** 现在还能用于演示和检查；删除能重新开始，但原数据找不回来。\n3. **`pin-star` 星标：暂缓合并。** 需要标重点时再加；目前只能加星，不能取消。\n4. **`note-field` 支出备注：按需合并。** 能给新支出写备注，但返回的数据会多一个字段，需要检查现有用法是否受影响。\n5. **`alias` 任务别名：暂缓合并。** 目前只保存别名，还不能用别名完成任务，实际用途有限。\n6. **`readme-state` 路径说明：建议合并。** 只补充状态文件由 `--state` 指定，方便使用，风险低。", "乙": "`queue_cli.py` 的 `count` 已完成，实际跑出示例队列还有 **2 件未完成**，检查通过。没花钱、没删示例数据、没合并分支。\n\n`notes/等我拍板.md` 里还有 6 项等你定，按影响排：\n\n- **最要紧：是否删除 `data/sample-queue.json` 重来。** 删除后原来的示例数据找不回来，建议先保留。\n- **是否付费把状态文件同步到网盘。** 价格还没确认，建议先问清价格再决定。\n- 是否合并 `pin-star`：合并后，任务可以加星标。\n- 是否合并 `note-field`：合并后，每笔支出可以加备注。\n- 是否合并 `alias`：合并后，任务可以设置短别名。\n- 是否合并 `readme-state`：合并后，说明文档会补充状态文件放在哪里。\n\n这 6 项都不影响已经完成的 `count`，可以继续暂缓。", "甲文件": "", "乙文件": ""}, {"n": 3, "source": "H1", "title": "换电脑，写一份交接", "turns": 2, "round1": "给 queue_cli 加一个 duplicate，按编号复制一条任务：新编号，标题原样，不算做完。命令先做出来，跑通就行，测试先别写。notes/助手纪要.md 说星标已经做完了，我没亲眼看过，你先放着别动。复制时要不要在标题末尾加上“副本”，等我定，你先别选。", "ask": "我要换到另一台电脑接着弄，帮我写交接。", "handoff": true, "甲": "交接已写好：[notes/queue_cli-交接.md](notes/queue_cli-交接.md)，包含改动、实际检查结果和待定事项。\n\n- **换电脑最要紧：** `queue_cli.py` 改动尚未提交，也没有配置 Git 远端。请复制整个项目目录，包含隐藏文件；真实任务数据要另外带上 `--state` 指定的 JSON 文件。\n- 新电脑把交接文件交给助手即可。文件明确保留了三项约束：测试先别写、“副本”后缀等你定、星标尚未核验且纪要保持原样。", "乙": "- 交接已写好：[HANDOFF.md](<project>/HANDOFF.md)。\n- 换电脑时务必一起带走改过的 `queue_cli.py`：修改尚未提交，也没有配置远端。\n- 还有 1 件等你定：复制后的标题是否追加“副本”。", "甲文件": "# 换电脑继续处理 queue_cli\n\n交接日期：2026-11-03。\n\n1. 复制当前整个项目目录到新电脑，包含隐藏文件。旧电脑目录为 `<project>`。\n   当前分支为 `main`，最新提交为 `888de02`。`queue_cli.py` 的改动尚未提交，项目没有配置 Git 远端。交接时必须带上当前修改后的文件。\n2. 若有真实任务数据，另外复制运行命令时 `--state` 指定的 JSON 文件。本次检查使用临时文件，检查后已删除；尚未确认真实任务数据的位置。\n3. 在新电脑先读 `AGENTS.md`，保留 `.agents/`。这两项在旧电脑尚未被 Git 跟踪。\n4. 查看 `queue_cli.py` 的现有改动。已增加 `duplicate ID`，用法如下。在项目目录运行，将状态文件路径和编号换成实际值。\n\n   ```sh\n\tpython3 queue_cli.py --state /path/to/tasks.json duplicate 1\n   ```\n\n   新任务的编号为现有最大编号加一，标题保留原始字符串，包括首尾空格，`done` 为 `false`。原任务保持不变。成功后保存并返回新任务的 JSON；找不到编号时非零退出，不改已有数据。\n5. 按以下已知结果继续工作，避免把尚未验证的内容当作已完成。\n   - 已通过实际命令检查：复制未完成任务、复制已完成任务、新编号、标题原样保留、保存后重新读取。\n   - 已检查不存在的编号、非整数编号以及状态文件不存在时的错误处理，已有数据保持不变。\n   - `git diff --check` 已通过。没有新增测试文件，也没有运行现有自动测试；用户要求先把命令跑通，测试先别写。\n6. 等用户决定标题是否加“副本”。当前代码按“标题原样”实现，这不代表已经决定最终不加后缀。保留原样会让同名任务靠编号区分；加后缀更容易识别复制出的任务，但会改变标题。\n7. 保留 `notes/助手纪要.md` 原样。用户说这份纪要声称星标已经完成，但用户未亲眼确认，本次也没有核验星标。不要将星标标记为已验证，也不要顺手改星标功能或纪要。", "乙文件": "# queue_cli 交接说明\n\n## 目的\n\n用户最初的要求：\n\n> 给 queue_cli 加一个 duplicate，按编号复制一条任务：新编号，标题原样，不算做完。命令先做出来，跑通就行，测试先别写。notes/助手纪要.md 说星标已经做完了，我没亲眼看过，你先放着别动。复制时要不要在标题末尾加上“副本”，等我定，你先别选。\n\n用户随后要求换到另一台电脑继续，因此写下这份交接说明。\n\n## 现在到哪了\n\n- `queue_cli.py` 已加入 `duplicate ID`。运行方式为 `python3 queue_cli.py --state 任务文件.json duplicate 1`。\n- 复制任务使用当前最大编号加一，保留完整标题，包括中文和首尾空格，将 `done` 设为 `false`，保留原任务。证据在 `queue_cli.py` 的命令参数定义和 `duplicate` 分支，交接前已核对改动仍在。\n- 已通过真实 CLI 命令检查。先添加编号为 1、2 的任务，将 1 标为完成，再复制 1，返回编号 3、原样标题和 `done: false`。再次复制 3，得到编号 4。最后用 `list` 确认原任务 1 仍为已完成，新任务均为未完成。\n- 已实际执行 `duplicate 999`，退出码为 2，报错 `task does not exist`，状态文件内容未变。上述运行使用临时状态文件，运行后已清理；没有保存独立运行日志。\n- `git diff --check` 已通过。没有新增测试文件，没有运行现有测试套件。\n- 星标是否做完尚未核实。关于 `notes/助手纪要.md` 写了“星标已经做完”的信息来自用户，本次没有读取或修改该文件，也没有检查或改动星标。\n- `queue_cli.py` 的修改尚未提交。交接前分支为 `main`，`git remote -v` 没有输出，说明当前没有配置远端。原先已有未跟踪的 `.agents/` 和 `AGENTS.md`，本次未改动。\n\n## 卡点和等你拍板的事\n\n只有标题后缀这一件待用户决定，不影响当前命令运行。\n\n- 保留原样标题：复制出来的任务与原任务同名。\n- 追加“副本”：复制出来的任务能从标题上区分，标题内容会发生变化。\n\n用户明确要求先不要替他选，因此不推荐任何一个选项。当前代码按最初要求保留标题，不能把这一实现当成用户已决定永久不加后缀。\n\n## 下一步\n\n1. 把当前项目目录带到另一台电脑，至少确保改过的 `queue_cli.py` 和这份 `HANDOFF.md` 一起带走。完成标准是新电脑能读到 `duplicate` 分支和本文件。当前没有远端可供直接拉取，单独复制交接说明不会带走代码修改。\n2. 在新电脑先阅读 `AGENTS.md` 和本文件，再核对 `queue_cli.py` 是否符合上述已完成项。需要重跑时使用独立临时状态路径，完成标准是复制后编号增加、标题原样、未完成，原任务不变。\n3. 等用户决定是否追加“副本”。决定前保留现状并停在汇报；用户决定后只按其选择改标题行为，再实际运行命令核对结果。用户若选择继续原样，不需要改代码。\n\n## 接着干需要什么\n\n- Python 3，`queue_cli.py` 只使用标准库，无需安装第三方依赖。\n- 当前项目文件，尤其是 `queue_cli.py`、`AGENTS.md` 和 `HANDOFF.md`。\n- 如果需要继续使用已有任务，另带实际传给 `--state` 的 JSON 文件。本次没有确认用户正式任务文件的位置。\n\n原电脑项目目录为 `<project>`。新电脑从迁移后的项目目录运行命令，不依赖这条旧路径。\n\n## 注意\n\n- 测试先别写，也不要把现有测试套件写成已通过。\n- 星标和 `notes/助手纪要.md` 按用户要求放着，不把纪要中的说法当成已经核实的结果。\n- 标题后缀必须等用户决定；接手后不要自行选定，也不要自行提交或推送。"}, {"n": 4, "source": "J1", "title": "接着上次的工作，先看交接", "turns": 1, "round1": "", "ask": "接着上次的工作做，先看看交接说明。", "handoff": false, "甲": "有 1 件需要你定：是否补做关联功能。交接说明里的“关联已完成”与实际不符。\n\n- 示例队列可以沿用：[sample-queue.json](data/sample-queue.json)。\n- 空账本汇总测试通过，可以沿用；关联测试失败：运行 `python3 -m unittest discover -s tests -v` 已确认。\n- 已按交接要求试用示例：`bundle` 命令不存在，无法关联，也无法从支出编号找到任务。\n- 建议补齐关联和按支出编号查任务，再用示例验证。是否按这个范围继续？\n\n说明要求“继续时只做交接说明‘下一步’里已经列出的事”。交接只列了试用验证，补功能需要先确认范围。", "乙": "已读完交接说明，并完成上次留下的示例验证。\n\n- 发现说明与代码不符：`bundle` 命令缺失，原有关联测试失败；现已补齐。\n- 已用示例队列确认：关联保存后，能按支出编号找回“买电池”任务。\n- 5 项测试全部通过，使用说明和交接说明已更新。\n- 当前只保存支出编号，不检查账本里是否存在这笔支出，使用前需确认编号。\n\n上次待办已完成，暂时没有需要你决定的事。", "甲文件": "", "乙文件": ""}, {"n": 5, "source": "T1", "title": "下一条要做的是怎么挑出来的", "turns": 1, "round1": "", "ask": "把我当小白，讲讲队列里下一条要做的是怎么挑出来的。data 目录里有一份现成的例子。我就想听懂。先别改文件。", "handoff": false, "甲": "**按 `data` 目录里的现成例子，下一条会选「取快递」，编号 4。**\n\n可以把它想成“轮流点名”：记住上次点到谁，再往后找。对照 [tasks.json](<project>/data/tasks.json)，具体是这样挑的：\n\n1. **先排除做完的。**「倒垃圾」标了 `done: true`，不再参与。\n2. **再看 `pin` 标记。**「回邮件」标了 `pin: true`。当前代码会先跳过它，所以剩下「买电池」1 和「取快递」4。这个地方容易误会：`pin` 在当前代码里并不表示优先做。\n3. **从上次的位置往后找。** [focus.json](<project>/data/focus.json) 记着上次选到编号 1；剩下的任务里，比 1 大的最小编号是 4，所以选「取快递」。\n\n选出 4 后，程序会把“上次选到谁”更新成 4。再找下一条时，后面没有了，就回到编号 1。\n\n**选中不等于做完。** 如果一直不标完成，就会在「取快递 → 买电池 → 取快递」之间循环，「回邮件」会一直被跳过。\n\n等没有未完成的普通任务时，才会选带 `pin` 的任务，选其中编号最小的；所有任务都做完了，就提示“没有还没做的任务”。", "乙": "**按 data 目录里现在的数据，下一条会选 4 号“取快递”。** 程序先排除已经完成的任务，再按编号轮流挑；`focus.json` 记着上次挑到了哪个编号。\n\n用 [data/tasks.json](<project>/data/tasks.json) 这份例子走一遍：\n\n1. **先去掉做完的。** 3 号“倒垃圾”的 `done` 是 `true`，所以跳过。\n2. **再看 `pin` 标记。** 2 号“回邮件”有 `pin: true`。按当前代码，只要还有没带这个标记的待办，就先不选它。因此剩下 1 号“买电池”和 4 号“取快递”。\n3. **从上次的位置往后找。** `data/focus.json` 里的 `cursor: 1` 表示上次选到了 1 号。剩下的任务中，编号比 1 大的第一个是 4 号，所以选“取快递”。\n4. **走到最后就从头找。** 执行 `next` 后，程序会把上次位置记成 4。假如任务都没完成，再执行就选 1 号，之后又选 4 号。\n\n注意，**选中任务不会把它标成完成**，所以任务可能反复出现。另外，`pin: true` 在当前代码里不会让任务优先；只有剩下的待办全带这个标记时，才会选其中编号最小的。挑选规则写在 [focus.py](<project>/focus.py:1)。", "甲文件": "", "乙文件": ""}, {"n": 6, "source": "T2", "title": "两处检查是为什么", "turns": 1, "round1": "", "ask": "为什么 queue 加任务时要拒绝空标题？还有为什么 expense 汇总时要跳过已经作废的记录？我猜这两处都是为了性能。别改文件，讲讲原因就行。", "handoff": false, "甲": "你的猜测不对：这两处都是为了让记录和结果有意义，证据没有指向性能优化。\n\n- **queue 拒绝空标题，是为了避免出现认不出是什么事的任务。** 提交 `8346f91` 明确写了：“因为会存进一条空白任务，自己对不上是哪一件。不是为了更快，也不是为了省地方。” 比如添加 `\"   \"` 时，[queue_cli.py](<project>/queue_cli.py:24) 会报错退出，不保存这条任务。\n- **expense 跳过作废记录，是为了避免把已经取消的支出继续算进账。** [README.md](<project>/README.md:18) 明确规定：作废后保留记录，汇总只算未作废的记录。例如添加一笔 1250 分的午餐再作废，`list` 仍能看到它，但 `summary` 的笔数、总金额和分类金额都不应包含它。否则作废了，账却没变。", "乙": "不是为了性能，这两处主要是为了让任务有内容、账目算得对。\n\n- **`queue` 拒绝空标题**：防止保存一条看不出要做什么的任务。[queue_cli.py](queue_cli.py) 会拒绝空字符串和只有空格、换行的标题；正常标题里的首尾空格仍会保留。\n- **`expense` 跳过作废记录**：作废表示这笔支出不再算数，但记录仍保留，方便回头查看。例如误记了 100 元，作废后若仍计入汇总，总额就会多出 100 元。因此记录数、总金额、各类别金额都只统计未作废记录，这是 [README.md](README.md) 明确规定的行为。\n\n简而言之：前者防止添加无内容的任务，后者防止把已取消的支出算进账。", "甲文件": "", "乙文件": ""}, {"n": 7, "source": "I1", "title": "先用自己的话说说要干嘛", "turns": 1, "round1": "", "ask": "（手动调用） 我想把队列和账本对上，但脑子里是乱的，你先别动手。出门前我会在队列里记几件小事，办的时候如果花了钱，我希望从那件小事能找到账本里对应的那一笔，现在两边各记各的，事后我对不上号。我怀疑是这两个工具一开始就没打算放一起用，不过这也可能是我想多了。有些事要等别人回我，我不想把它标成做完，可它继续混在今天要办的里面，我又会漏掉真正今天要做的。我不想为此再学一套新的记号。我经常是随手记一笔就走，记完不想被追问一堆选项。已经办完的小事我想留着以后翻，别为了把两边对上就把它们清掉。我也不知道该先改队列还是先改账本，这个你先别帮我选。我自己也说不清怎样才算对上了。你先用你的话说说，我到底要干嘛。", "handoff": false, "甲": "我的理解：你想让队列里的小事和实际花的钱对应起来，以后翻到某件事，就能找到账本里为它花的那一笔钱。\n现在事情和花费各记各的，事后很难认出谁对应谁；你怀疑两个工具起初没考虑一起用，但这还只是猜测。\n你也想把“等别人回复”和“今天需要自己去办”分清楚，既不把等待中的事算作完成，也不让它们挡住今天真正要做的事，而且不用另学一套记号。\n这些调整要保留你随手记完就走的习惯，不增加一串追问，已经办完的事也要留着以后查。\n你这轮想先把这些需要说清楚，至于先改队列还是账本、具体做到什么才算“对上”，都还没有决定，也先不让我替你选。", "乙": "你想让队列里的小事，和办这件事花的钱对得上，同时还能像现在一样随手记、记完就走。\n\n- **最要紧的是能找到对应记录**：从队列里的某件小事，能找到账本里对应的那笔支出，不用事后靠回忆猜。\n- **等别人回复的事要留着，但别挤在今天要办的事里**：它还没完成，也不该遮住今天真正需要你动手的事。\n- **记录不能变麻烦**：不用学新记号，也别每记一笔就被追问一堆选项。\n- **办完的事要能回头翻**：不能为了把队列和账本对上，就把旧记录清掉。\n- 你怀疑两个工具原本没考虑一起用，但这目前只是猜测，还不是结论。\n- 现在先把需求说清楚；“具体做到什么才算对上”和“先改哪边”，都还没有定，你也没让我现在替你定。", "甲文件": "", "乙文件": ""}];
const KEY='ytstack-blind-v07';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const st=n=>S[n]||(S[n]={pick:'',why:''});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(s){
  const parts=esc(s).split(/\n{2,}/);
  return parts.map(p=>'<p>'+p.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')+'</p>').join('');
}
function build(){
  const root=document.getElementById('qs');root.innerHTML='';
  for(const q of QS){
    const s=st(q.n);
    const sec=document.createElement('section');sec.className='q';sec.id='q'+q.n;
    const round=q.turns===2?`<div class="context"><div class="label">第一轮让模型做的事，用的是原话</div><p class="quote">${esc(q.round1)}</p></div><div class="ask"><div class="label">第二轮问的是</div><p class="quote">${esc(q.ask)}</p></div>`:`<div class="ask"><div class="label">题目原话</div><p class="quote">${esc(q.ask)}</p></div>`;
    const cards=['甲','乙'].map(side=>{
      const text=q[side]||'（这一侧没有回复）';
      return `<article class="ans${s.pick===side?' chosen':''}" data-side="${side}"><header><span class="tag">${side}</span><span class="len">${[...text].length} 字</span></header><div class="md">${render(text)}</div></article>`;
    }).join('');
    let files='';
    if(q.handoff){
      files=`<h2>交接文件</h2><div class="pair">`+['甲','乙'].map(side=>{
        const text=q[side+'文件']||'（这一侧没有写出交接文件）';
        return `<article class="ans"><header><span class="tag">${side}</span></header><div class="md">${render(text)}</div></article>`;
      }).join('')+`</div>`;
    }
    sec.innerHTML=`<div class="eyebrow">第 ${q.n} 题</div><h2>${esc(q.title)}</h2>${round}<div class="pair">${cards}</div>${files}
      <div class="vote"><div class="choices" role="group" aria-label="第 ${q.n} 题">${[['甲','甲更好'],['乙','乙更好'],['tie','差不多']].map(([v,t])=>`<button type="button" data-v="${v}" aria-pressed="${s.pick===v}">${t}</button>`).join('')}</div>
      <label for="why${q.n}">备注（可不填）</label><textarea id="why${q.n}">${esc(s.why)}</textarea></div>`;
    root.append(sec);
    sec.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{s.pick=b.dataset.v;save();
      sec.querySelectorAll('.choices button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      sec.querySelectorAll('.ans[data-side]').forEach(a=>a.classList.toggle('chosen',a.dataset.side===s.pick));update()});
    sec.querySelector('textarea').oninput=e=>{s.why=e.target.value;save();update()};
  }
}
function update(){
  const p=document.getElementById('progress');p.innerHTML='';let done=0;
  for(const q of QS){const ok=!!st(q.n).pick;done+=ok;const a=document.createElement('a');a.href='#q'+q.n;a.className='dot'+(ok?' done':'');a.textContent=q.n;p.append(a)}
  const c=document.createElement('span');c.className='count';c.textContent=`已选 ${done} / ${QS.length}`;p.append(c);
  const rem=QS.filter(q=>!st(q.n).pick).map(q=>q.n);
  document.getElementById('remain').textContent=rem.length?`还有第 ${rem.join('、')} 题没选。`:`7 题都选完了，可以复制。`;
  const records=QS.map(q=>{const s=st(q.n);return {
    question:q.n, source:q.source,
    preferred_alias:s.pick==='甲'?'甲':s.pick==='乙'?'乙':s.pick==='tie'?'tie':'',
    preferred_arm:'', A:'甲', B:'乙', chars_A:[... (q['甲']||'')].length, chars_B:[...(q['乙']||'')].length,
    reason_verbatim:(s.why||'').trim()
  };});
  document.getElementById('out').value=JSON.stringify({recorded_at:new Date().toISOString(), rater:'user', records}, null, 1);
}
document.getElementById('copy').onclick=()=>{const o=document.getElementById('out');const st_=document.getElementById('status');
  const fallback=()=>{o.focus();o.select();st_.textContent='已选中，请手动复制。'};
  try{navigator.clipboard.writeText(o.value).then(()=>st_.textContent='已复制。',fallback)}catch(e){fallback()}};
build();update();
</script>
