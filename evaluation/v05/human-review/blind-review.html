加、列出、完成任务三个命令，现有测试没有覆盖任务队列。\n\n分三步做，以下是计划中的完成标准，尚未运行验证：\n\n1. **加搜索入口。** 用 `python3 queue_cli.py --state tasks.json search \"周报\"` 查找任务。完成标准：标题含“周报”的任务全部返回，保留完整信息和添加顺序；没有匹配、队列为空时返回 `[]`。\n2. **明确搜索规则。** 建议按连续文字查找，英文不分大小写，忽略输入两端的空格；标点按原样匹配。完成标准：中文、英文大小写、部分标题都能找到；缺少关键词或只输入空格时，报错并以非零状态退出。\n3. **补检查和用法说明。** 用独立数据文件实际运行命令，核对返回结果和搜索前后的文件内容。完成标准：搜索不改数据、不创建缺失的数据文件；重新启动后仍能搜到原有任务；添加、列出、完成任务的原有行为保持正常。\n\n- **你亲自看效果：** 实现后用几条日常任务试搜，确认返回信息够你辨认任务；自动检查不能代替这一步。\n- **最要紧的选择，已按推荐写入：** 连续文字匹配；若改成“多个词分别出现就算匹配”，搜索 `\"周报 草稿\"` 也会找到“周报的第一版草稿”。\n- **另一个选择，已按推荐写入：** 包含已完成任务；若只查未完成任务，已完成的旧任务就搜不到。\n\n确认后可以交给 create-test-skill 变成可运行的测试。"}, {"n": 3, "kind": "speech", "q": "我一直以为 queue_cli 和 expense_cli 出错时就是打一行提示、照常退出，退出码还是 0，脚本里看输出就行。我理解得对吗？不对就纠正，漏的也补上。", "A": "不对。**出错时退出码不是 0，脚本应先判断退出码，再读取输出。** 已核对代码并运行验证：\n\n- `queue_cli`：空标题、任务不存在，打印用法和错误提示，退出码 **2**。见 [queue_cli.py:25](/private/var/folders/74/ws5jw71j68lfltft9x4729f80000gn/T/ytev-1vt4g8u6/project/queue_cli.py:25)。\n- `expense_cli`：标题或分类为空、金额非正数、记录不存在，打一行提示，退出码 **1**。见 [expense_cli.py:32](/private/var/folders/74/ws5jw71j68lfltft9x4729f80000gn/T/ytev-1vt4g8u6/project/expense_cli.py:32)。\n- 两者缺参数或参数格式错误，退出码都是 **2**；文件内容损坏、读写失败等未处理错误，会打印多行报错，通常退出码 **1**。\n- 错误写到 `stderr`（错误输出），正常 JSON 写到 `stdout`（标准输出）。只捕获标准输出会漏掉报错；正常完成才返回 **0**。", "B": "不对。**最要紧的是：脚本应先看退出码；这些错误不会照常以 `0` 退出。** 我实际运行了 14 个案例，结果与代码一致：\n- **两者的参数错误**：缺必填参数、命令写错、整数传成文字，退出码都是 **`2`**；用法说明和错误写到错误输出（`stderr`），通常不止一行。\n- **`queue_cli` 的内容错误**：标题全空白、完成不存在的任务，也退出 **`2`**，输出用法说明和错误。见 [queue_cli.py](/private/var/folders/74/ws5jw71j68lfltft9x4729f80000gn/T/ytev-0urcbvh2/project/queue_cli.py:24)。\n- **`expense_cli` 的内容错误**：标题或类别全空白、金额不大于零、作废不存在的记录，向 `stderr` 打一行提示，退出 **`1`**。`main()` 返回的 `1` 会通过 `sys.exit(main())` 变成退出码。见 [expense_cli.py](/private/var/folders/74/ws5jw71j68lfltft9x4729f80000gn/T/ytev-0urcbvh2/project/expense_cli.py:33)。\n- **其他异常**：损坏的 JSON、把目录当状态文件等没有统一处理；实测会向 `stderr` 输出多行 Python 错误详情，退出 **`1`**。读写权限等异常也没有专门处理。\n- **不是错误的情况**：状态文件不存在会按空数据处理；正常完成的命令向正常输出（`stdout`）写 JSON，退出 `0`。`--help` 也退出 `0`，但输出的是帮助文字。\n- **脚本里的做法**：先判断退出码；非零就走失败处理并保留 `stderr`，成功时再解析 `stdout`。只读取 `stdout` 会漏掉上述错误信息。\n- **数据方面别混为一谈**：上述内容校验失败发生在保存前，不改已有数据；但保存途中失败没有恢复旧文件的处理，不能认为“非零退出就一定没改数据”。这一点来自代码检查，未实测写入故障。"}, {"n": 4, "kind": "speech", "q": "我偶尔有美元支出。你说我该给 expense 加多币种，还是记账时自己按汇率换成人民币，把汇率写在标题里？", "A": "**建议先不加多币种：偶尔有美元支出，就换成人民币记账，标题保留美元原价和换算依据。**\n\n- **最要紧的是总额算对。** `expense_cli.py` 现在把所有金额直接相加，不区分币种。美元金额直接填进去，会让总支出和分类统计都不准确。\n- 如果银行卡已经扣了人民币，就记实际扣款，省去查汇率，也能包含银行收取的费用。标题可写：`订阅费｜USD 10｜实扣 RMB 72.35`。\n- 如果直接花美元、没有人民币扣款，就按你选定的汇率折算。比如假设汇率是 7.2，10 美元记 72 元，标题写：`订阅费｜USD 10｜汇率 7.2`。程序里的金额仍填人民币分，即 `7200`。\n- **什么时候值得加多币种：** 你开始经常记美元、想单独查看美元花了多少，或需要逐笔核对美元账单时。届时应分别保存美元原价和人民币记账金额，让人民币统计继续可用。\n\n按你现在“偶尔支出”的情况，手动换算增加的麻烦很小，暂时不值得改程序。", "B": "**建议先统一换成人民币记账，把美元原价和换算依据写在标题里。** 你只是偶尔有美元支出，暂时不值得加多币种。\n\n- expense 目前会直接加总所有金额，不区分币种。金额统一记人民币，总支出和分类统计就能继续正常用。\n- 已有人民币扣款金额，就按实际扣款记；还没有，就用你选定的汇率换算，标题注明“估算”。\n- 例如：标题写 `软件订阅｜USD 10｜汇率 7.20（估算）`，金额记 72 元，即 `--cents 7200`。汇率仅为示例。\n- 标题里的信息只能供你回看，程序不会据此统计美元支出。等你经常用美元消费，或需要单独统计美元金额时，再加多币种。"}, {"n": 5, "kind": "acceptance", "q": "queue_cli 里完成的任务越来越多，list 看着乱。我想加个归档：已完成的任务挪到单独的文件，主文件只留没完成的。动手之前，先把验收标准定下来。", "A": "这次要做到：已完成任务保存到归档文件，主文件只保留未完成任务，归档后新增任务不会复用旧 ID。\n\n看过代码：目前 `complete` 只改 `done`，`list` 返回主文件全部任务；现有测试没有覆盖 queue_cli。下面是**待确认的验收标准，尚未运行验证**，本次未改代码。\n\n1. **归档入口与旧数据**  \n   推荐 `complete ID` 成功后立即归档该任务；新增 `archive` 命令，搬走旧主文件中已有的全部已完成任务。以 `--state /tmp/q.json` 为例，归档文件为 `/tmp/q.json.archive.json`，内容也是 JSON 数组。`archive` 成功返回 `{\"archived\":本次搬移数量}`，退出码为 0。\n\n2. **搬移准确，不丢不重**  \n   准备主文件包含未完成的 1、3 和已完成的 2、4，归档已有 5。执行 `archive` 后，主文件只含 1、3，归档依次含 5、2、4，返回 `{\"archived\":2}`。逐条比对两个文件：任务总数不变，原有 ID、标题、`done` 和其他字段完整保留，各自顺序不变。\n\n3. **完成、查看与持久化**  \n   对未完成的任务 1 执行 `complete 1`，仍返回完整任务，`done` 为 `true`；主文件移除 1，归档追加 1。重新启动独立进程执行 `list`，只看到剩余未完成任务；重新读取归档文件仍能找到 1。重复 `complete 1` 返回同一任务，两文件不变。\n\n4. **边界与失败输入**\n\n   | 场景 | 通过条件 |\n   |---|---|\n   | 主文件全部已完成 | 归档后主文件为 `[]`，任务全部保留在归档 |\n   | 没有已完成任务、重复归档 | 返回 `{\"archived\":0}`，已有文件内容不变 |\n   | 主文件不存在 | `list` 返回 `[]`；`archive` 返回零，不创建文件 |\n   | 归档中最大 ID 为 9，主文件为空 | 下一次 `add` 使用 ID 10 |\n   | 空白标题、不存在或非整数的完成 ID | 非零退出，stderr 有错误，两文件不变 |\n   | 归档文件不是有效 JSON | 涉及归档的写入命令报错，两文件不变 |\n\n5. **用户检查**  \n   用一份真实任务副本完成一次任务、执行一次旧数据归档，再查看 `list` 和归档文件，由你确认日常查看是否清楚。自动检查不能代替你判断这个操作流程是否顺手。\n\n6. **不能弄坏**  \n   `--state` 继续隔离不同队列；新增任务保留 Unicode 和标题首尾空格，初始 `done=false`；首次写入创建父目录；成功命令输出一个 JSON 值，退出码为 0。证据须来自实际 CLI 命令、退出码及保存的文件内容。本次不加恢复归档功能；并发和进程中断恢复另定范围。\n\n已按推荐写进上面的条件，你可以改：\n\n- **触发方式**：完成后立即归档，旧数据用 `archive` 清理；改为全手动，则两次归档之间主文件仍会积累已完成任务。\n- **文件位置**：在主文件路径后追加 `.archive.json`；改为可指定路径，需要增加参数及路径校验。\n- **查看历史**：本次直接查看归档文件；若要在 CLI 查看，再增加 `list --archived`。\n\n确认后可以交给 create-test-skill 变成可运行的测试。", "B": "这次要做到：执行归档后，已完成任务移入单独文件，主文件只留未完成任务，`list` 随之清爽。\n\n目前 `queue_cli.py` 只有 `add/list/complete`；完成任务仍留在主文件，ID 按主文件最大值加一。README 和现有测试没有覆盖这个工具。下面是待确认的验收标准，尚未实现或运行验证。\n\n以下以 `Q` 表示独立测试用的主文件路径，`A` 表示归档文件路径。\n\n1. **归档入口与结果**  \n   推荐新增 `python3 queue_cli.py --state Q archive`，手动归档全部已完成任务。成功时退出码为 0，输出一个 JSON 值，包含本次归档数量和归档路径。`complete` 仍只标记完成；执行归档后，主文件才只含未完成任务。\n\n2. **移动完整，不丢任务**  \n   准备主文件含未完成任务 1、3，已完成任务 2、4，归档已有任务 5。执行归档后，主文件仅含 1、3，归档依次含 5、2、4。逐条核对 ID、原始标题、完成状态及其他已有字段，均不得改变；两个文件合起来的任务不多不少。\n\n3. **列表与持久化**  \n   归档后另起进程执行 `python3 queue_cli.py --state Q list`，只返回 1、3，顺序不变。关闭后重新运行，并直接读取两个文件，结果仍一致。推荐归档保存在主文件旁：`tasks.json` 对应 `tasks.archive.json`；可直接读取该 JSON 查看历史，本次不新增历史查询或恢复命令。\n\n4. **空集和重复执行**  \n   按下表分别运行归档，并核对输出、文件内容及是否新建文件：\n\n   | 场景 | 通过条件 |\n   |---|---|\n   | 主文件不存在 | 归档数为 0，不创建文件 |\n   | 没有已完成任务 | 归档数为 0，已有文件内容不变 |\n   | 全部已完成 | 主文件为 `[]`，所有任务进入归档 |\n   | 连续归档两次 | 第二次数量为 0，历史任务不重复 |\n\n5. **ID 不复用**  \n   将当前最大 ID 归档，包括把主文件全部归档，再另起进程执行 `add`。新 ID 必须大于主文件和归档中的全部已有 ID。重复 `complete` 已归档的 ID，推荐返回原任务、成功退出，两个文件内容不变。\n\n6. **失败不损坏数据**  \n   分别验证损坏 JSON、任务记录缺少必要字段、归档路径被目录占用、文件不可写、写入过程中失败。命令须非零退出，stderr 指明相关路径和原因；记录错误还须指出第几条。不得覆盖无关文件或删除原任务。失败后重新运行，应能得到一致结果，每个任务恰好一份；如需恢复，必须明确提示并提供可执行的恢复办法，不能只留下报错栈。\n\n7. **不能弄坏已有行为**  \n   复查 `add` 保留中文和标题首尾空格、新任务为未完成；空白标题和不存在的完成 ID 仍报错且不改数据；`complete` 保留原任务其他内容；成功命令仍输出 JSON、退出码为 0。执行归档前，`list` 仍按原顺序返回主文件全部任务。使用独立路径实际运行这些命令，保存退出码、输出和操作前后文件作为证据，并检查是否引出新问题。\n\n已按推荐写进上面的条件，你可以改：\n\n- **触发时机：手动归档。** 改为完成即自动归档，`complete` 后任务会立即从列表消失，还需约定旧任务何时迁移。\n- **保存位置：主文件旁固定命名。** 改为指定路径，使用时需额外传参并保持路径一致。\n- **历史操作：直接查看文件，重复完成成功。** 可改为新增历史查询命令，或对已归档 ID 报错。\n\n确认后可以交给 create-test-skill 变成可运行的测试。"}, {"n": 6, "kind": "acceptance", "q": "expense 一笔记录只能填一个类别，像请客这种一半算餐费、一半算人情的，就记不准。我想加拆分，让 summary 的 by_category 分开算。动手之前，先把验收标准定下来。", "A": "这次要做到：一笔 expense 可按金额分到多个类别，`summary.by_category` 按拆分金额汇总，整笔仍只算一条记录。以下是待确认标准，尚未实现或验证。\n\n1. **新增拆分记录**\n   建议入口：`add \"请客\" --cents 10000 --split food 5000 --split social 5000`。成功后返回一个 ID、总额及各项类别和金额。`list` 也能看到这些内容。验收证据为实际命令输出和保存的账本内容；下文命令均带 `python3 expense_cli.py --state <独立账本路径>` 前缀。\n\n2. **汇总金额与记录数准确**\n   先用原命令添加 food 类别午餐 1250 分，再添加上述请客记录。执行 `summary`，必须得到：\n   ```json\n   {\"count\":2,\"total_cents\":11250,\"by_category\":{\"food\":6250,\"social\":5000}}\n   ```\n   同一类别出现在多条记录或同笔多个拆分项中，都累加；类别金额之和必须等于总额。\n\n3. **拒绝不完整或错误拆分**\n   拆分至少两项，每项金额为正整数分，合计必须等于整笔金额；不自动补差或四舍五入。以下逐项实际运行验收：\n\n   | 输入 | 应看到 |\n   |---|---|\n   | 总额 2 分，拆成各 1 分 | 成功 |\n   | 零、负数、小数、非整数金额 | 失败，指出错误项 |\n   | 空白类别、只有一个拆分项、缺少金额 | 失败，说明原因 |\n   | 合计比总额多或少 1 分 | 失败，显示总额和拆分合计 |\n   | 同时传 `--category` 和 `--split` | 失败，提示只能选一种 |\n\n   失败须非零退出、stderr 有可读错误；已有账本内容不变，不留下半笔记录，也不消耗 ID。\n\n4. **保存与作废完整**\n   添加后退出，另开进程执行 `list`、`summary`，结果保持一致。作废请客记录后，汇总只剩午餐：`count=1`、`total_cents=1250`、`by_category={\"food\":1250}`。原记录和拆分仍在，重复作废无额外影响。证据为各进程输出及前后账本内容。\n\n5. **不能弄坏**\n   旧账本直接可读；原 `add --category` 的输出保持不变。ID 递增、列表顺序、Unicode 和首尾空格保留、空账本结果、缺失文件只读时不创建、首次写入创建父目录等原约定继续成立。状态路径被同名目录占用、父路径被普通文件占用时，报错指出路径并保留原内容。改后复查这些行为及新增问题；损坏 JSON、并发写入和权限异常仍沿用 README 的范围排除。\n\n6. **人工确认与待定规则**\n   你需确认“100 元请客分为餐费 50 元、人情 50 元，但记录数仍是 1”符合记账口径；自动检查不能代替这项确认。\n\n   已按推荐写进上面的条件，你可以改：\n   - **按分填写且合计严格相等**；改用比例需另外确定尾差归属。\n   - **本次只在新增时拆分**；若要拆历史记录，需增加编辑入口及验收。\n   - **允许重复类别并累加**；改为拒绝则需先自行合并金额。\n\n确认后可以交给 create-test-skill 变成可运行的测试。", "B": "这次要做到：一笔支出可以分配到多个类别，`summary.by_category` 按分配金额统计，总金额和笔数不重复计算。\n\n已读 [README.md](README.md)、实现和现有测试。下面是待确认的验收标准，尚未实现或验证；本轮不改项目文件。\n\n1. **新增拆分记录。** 建议沿用 `add`，重复传入“类别＋分金额”，例如：\n\n   ```sh\n   python3 expense_cli.py --state /tmp/split-check.json add \"请客\" --cents 10000 --split food 5000 --split gift 5000\n   ```\n\n   成功后退出码为 0，输出一笔 JSON 记录，能读到总额及每项类别、金额；只分配一个 ID。原来的 `--category` 用法和返回字段保持不变。\n\n2. **金额必须对得上。** 拆分至少两项，每项金额为正整数分，合计必须等于 `--cents`；不自动补差或舍入。通过证据为实际命令的退出码、输出和状态文件：\n\n   | 输入 | 应看到的结果 |\n   |---|---|\n   | 总额 2 分，分成 1＋1 分 | 成功 |\n   | 总额 3 分，分成 1＋2 分 | 成功，原数保存 |\n   | 分项含 0、负数、小数或非数字 | 拒绝 |\n   | 合计比总额多或少 1 分 | 拒绝 |\n   | 只有一项、类别全空白、同时传 `--category` 和 `--split` | 拒绝 |\n\n   所有拒绝均非零退出、向 stderr 报错，不留下部分记录、不消耗 ID；已有文件内容不变，原本没有状态文件时不创建文件。\n\n3. **分类汇总准确。** 在空账本加入上述请客记录，再加入普通 `food` 支出 2000 分，实际运行 `summary` 应得到：\n\n   ```json\n   {\"count\":2,\"total_cents\":12000,\"by_category\":{\"food\":7000,\"gift\":5000}}\n   ```\n\n   同类分项累计到同一个类别；每次汇总的分类金额之和都等于 `total_cents`。类别沿用现有规则，保留 Unicode 和首尾空格，不自动合并不同字符串。\n\n4. **保存和作废完整。** 结束进程后重新运行 `list`，拆分金额、类别、总额和 ID 全部保留。作废请客记录后，明细仍可读，汇总变为一笔、2000 分、仅 `food: 2000`；重复作废结果不变。用独立进程输出及保存内容作证。\n\n5. **使用体验由你验收。** 你亲自录入一笔实际请客账，确认能表达分配，并能从输出核对每项金额。自动检查不能代替这项判断。\n\n6. **不能弄坏。** 旧状态文件无需转换即可读取；普通记录的新增、列表顺序、作废、ID 递增、空账本输出及原有错误处理保持不变。以旧格式样本运行前后结果为证，并运行 README 的 unittest 命令。现有 expense 测试只覆盖空汇总，单凭它通过不算完成。并发写入、损坏 JSON 和权限异常继续沿用现有范围排除。\n\n已按推荐写进上面的条件，你可以改：\n\n- **推荐手填各项金额，并校验总额**；改成比例拆分，需要另定余数分配规则。\n- **推荐允许重复类别，汇总时累加**；也可改为重复类别直接报错。\n- **推荐本次仅支持新增拆分记录**；若要补拆旧账，需要增加修改入口及对应验收。\n\n确认后可以交给 create-test-skill 变成可运行的测试。"}];
const KEY='ytstack-blind-review-r4';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const st=n=>S[n]||(S[n]={pick:'',why:'',A:[],B:[]});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const render=md=>window.marked?marked.parse(md,{gfm:true,breaks:false}):'<pre>'+esc(md)+'</pre>';
function highlight(el,terms){
  if(!terms.length)return;
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  const re=new RegExp(terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|'),'g');
  for(const n of nodes){if(!re.test(n.data))continue;re.lastIndex=0;const f=document.createDocumentFragment();let last=0;
    n.data.replace(re,(m,i)=>{f.append(n.data.slice(last,i));const k=document.createElement('mark');k.textContent=m;f.append(k);last=i+m.length;return m});
    f.append(n.data.slice(last));n.replaceWith(f)}
}
function build(){

    <div class="pair">${['A','B'].map(x=>`<article class="ans${s.pick===x?' chosen':''}" data-side="${x}"><header><span class="tag">${x}</span><button type="button" class="small mark-btn" data-side="${x}">标为黑话</button></header><div class="md">${render(q[x])}</div></article>`).join('')}</div>
    <div class="vote"><div class="choices" role="group" aria-label="第 ${q.n} 题选择">${[['A','选 A'],['TIE','平局'],['B','选 B']].map(([v,t])=>`<button type="button" data-v="${v}" aria-pressed="${s.pick===v}">${t}</button>`).join('')}</div>
    <div class="terms" data-terms></div>
    <label for="why${q.n}">一句原因（可不填）</label><textarea id="why${q.n}" placeholder="比如：A 的黑话少，但第二段重复了">${esc(s.why)}</textarea></div>`;
    root.append(sec);
    sec.querySelectorAll('.ans').forEach(a=>highlight(a.querySelector('.md'),s[a.dataset.side]));
    drawTerms(sec,q.n);
    sec.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{s.pick=b.dataset.v;save();
      sec.querySelectorAll('.choices button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      sec.querySelectorAll('.ans').forEach(a=>a.classList.toggle('chosen',a.dataset.side===s.pick));update()});
    sec.querySelector('textarea').oninput=e=>{s.why=e.target.value;save();update()};
    sec.querySelectorAll('.mark-btn').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{
      const side=b.dataset.side;const sel=window.getSelection();const md=sec.querySelector(`.ans[data-side="${side}"] .md`);
      const t=(sel?sel.toString():'').trim();
      if(!t||!sel.rangeCount||!md.contains(sel.getRangeAt(0).commonAncestorContainer)){flash(sec,`先在 ${side} 里用鼠标选中一个词，再点这里。`);return}
      if(t.length>40){flash(sec,'选中的内容太长了，选一个词或短语就行。');return}
      if(!s[side].includes(t))s[side].push(t);save();sel.removeAllRanges();build();update();document.getElementById('q'+q.n).scrollIntoView({block:'nearest'})}});
  }
}
function flash(sec,msg){const t=sec.querySelector('[data-terms]');t.textContent=msg;setTimeout(()=>drawTerms(sec,+sec.id.slice(1)),2200)}
function drawTerms(sec,n){const s=st(n);const t=sec.querySelector('[data-terms]');t.innerHTML='';
  const all=[...s.A.map(w=>['A',w]),...s.B.map(w=>['B',w])];
  if(!all.length){t.textContent='还没标黑话。';return}
  t.append('已标黑话：');
  for(const [side,w] of all){const c=document.createElement('span');c.className='chip';c.innerHTML=`${side}：${esc(w)}<button type="button" aria-label="删除 ${esc(w)}">×</button>`;
    c.querySelector('button').onclick=()=>{s[side]=s[side].filter(x=>x!==w);save();build();update()};t.append(c)}}
function update(){
  const p=document.getElementById('progress');p.innerHTML='';let done=0;
  for(const q of QS){const ok=!!st(q.n).pick;done+=ok;const a=document.createElement('a');a.href='#q'+q.n;a.className='dot'+(ok?' done':'');a.textContent=q.n;a.setAttribute('aria-label',`第 ${q.n} 题${ok?'，已选':''}`);p.append(a)}
  const c=document.createElement('span');c.className='count';c.textContent=`已选 ${done} / ${QS.length}`;p.append(c);
  const rem=QS.filter(q=>!st(q.n).pick).map(q=>q.n);
  document.getElementById('remain').textContent=rem.length?`还有第 ${rem.join('、')} 题没选，没选的也会照实写进结果。`:`${QS.length} 题都选完了，复制后贴回对话就行。`;
  const lab={A:'A',B:'B',TIE:'平局','':'未选'};
  document.getElementById('out').value='盲看结果\n'+QS.map(q=>{const s=st(q.n);let l=`第${q.n}题：${lab[s.pick]}`;if(s.why.trim())l+=`｜原因：${s.why.trim()}`;
    if(s.A.length)l+=`｜A黑话：${s.A.join('、')}`;if(s.B.length)l+=`｜B黑话：${s.B.join('、')}`;return l}).join('\n');
}
document.getElementById('copy').onclick=()=>{const o=document.getElementById('out');const st_=document.getElementById('status');
  const fallback=()=>{o.focus();o.select();st_.textContent='已选中文本，按 Ctrl+C 复制。'};
  try{navigator.clipboard.writeText(o.value).then(()=>st_.textContent='已复制，贴回对话里就行。',fallback)}catch(e){fallback()}};
build();update();
</script>
